# docker-compose.yml — language-tidbits-engine services
#
# Only Kokoro TTS lives here now. n8n was extracted on 2026-04-13 into the
# neutralworking/n8n-platform repo and runs from /opt/n8n-platform on the VPS.
# It reaches this compose's kokoro-tts via the shared external network
# `content-mesh`.
#
# Usage:
#   docker compose up -d                # start kokoro-tts
#   docker compose logs -f kokoro-tts   # watch logs
#   docker compose down                 # stop
#
# TTS API: http://localhost:8880 (loopback only — not exposed publicly)
#
# The n8n-platform n8n container resolves `kokoro-tts` over the content-mesh
# network, so this service name must remain stable.

services:
  # Kokoro TTS — local text-to-speech with OpenAI-compatible API
  # https://github.com/remsky/Kokoro-FastAPI
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    ports:
      # Loopback only — reachable from n8n-platform via content-mesh DNS.
      - "127.0.0.1:${TTS_PORT:-8880}:8880"
    environment:
      - DEVICE=cpu
    volumes:
      - kokoro_models:/app/models
    networks:
      - default
      - content-mesh

networks:
  default:
  content-mesh:
    external: true

volumes:
  kokoro_models:
